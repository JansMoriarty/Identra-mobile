name: identra_mobile_flutter
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0 # Untuk font yang aesthetic
  flutter_svg: ^2.0.10 # Jika icon/ilustrasi kamu formatnya SVG
  table_calendar: ^3.1.2
  intl: ^0.19.0
  http: ^1.6.0
  shared_preferences: ^2.5.3
  camera: ^0.11.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.0.7
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_commons: ^0.8.1
  path_provider: ^2.1.2
  mobile_scanner: ^5.1.0
  vibration: ^2.0.1
  audioplayers: ^5.2.1

  path: ^1.9.0
  tflite_flutter: ^0.10.4
  image: ^4.0.17

dependency_overrides:
  tflite_flutter: ^0.10.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/bg_main.png # Background utama (gradien gelap)
    - assets/images/bg_greeting.png # Background kartu ucapan
    - assets/images/profile.jpeg

    - assets/sounds/beep.mp3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
